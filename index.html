/*
 * NUMERIA — hoja de estilo base.
 *
 * Diseño tranquilo y de alto contraste, pensado primero para tablet: superficies
 * amplias, tipografía grande y ninguna estética médica ni de examen.
 */

:root {
  color-scheme: light;
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-alt: #eef1ec;
  --ink: #1d2321;
  --ink-soft: #4c5652;
  --line: #d8ded8;
  --accent: #2f6d5b;
  --accent-soft: #dceae4;
  --accent-ink: #ffffff;
  --warn: #8a5a12;
  --warn-soft: #fbf0dc;
  --alert: #8c3a2f;
  --alert-soft: #f8e3df;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 2px 10px rgba(29, 35, 33, 0.06);
  --max-width: 68rem;
}

/*
 * Tema oscuro. Se define en tres sitios porque el visor puede estar en tres
 * estados: sin marcar (solo cuenta la preferencia del sistema), marcado como
 * claro o marcado como oscuro. Solo se redefinen los tokens; ningún componente
 * declara color dentro de estos bloques.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --bg: #141917;
    --surface: #1c2320;
    --surface-alt: #232b28;
    --ink: #eef2ef;
    --ink-soft: #b3bdb8;
    --line: #333d39;
    --accent: #7fc0a8;
    --accent-soft: #24352e;
    --accent-ink: #10231c;
    --warn: #e0b877;
    --warn-soft: #34291a;
    --alert: #e8a496;
    --alert-soft: #351f1b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #141917;
    --surface: #1c2320;
    --surface-alt: #232b28;
    --ink: #eef2ef;
    --ink-soft: #b3bdb8;
    --line: #333d39;
    --accent: #7fc0a8;
    --accent-soft: #24352e;
    --accent-ink: #10231c;
    --warn: #e0b877;
    --warn-soft: #34291a;
    --alert: #e8a496;
    --alert-soft: #351f1b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  box-sizing: border-box;
}

/* --- Perfil de dominios --------------------------------------------------- */

.profile-row {
  display: grid;
  grid-template-columns: minmax(9rem, 16rem) 1fr auto;

/*
 * Identidad de Colmenia para el prototipo.
 *
 * Vive fuera del sistema de estilos de NUMERIA a propósito: el dorado sobre
 * fondo oscuro identifica a Colmenia en la cabecera y el pie, y no entra en las
 * pantallas de tarea, que deben seguir siendo tranquilas y sin estímulos que
 * compitan con el ejercicio.
 */

:root {
  --colmenia-ink: #15130f;
  --colmenia-gold: #d4af52;
  --colmenia-gold-soft: #f0dca4;
  --colmenia-on-dark: #efe9dc;
}

.colmenia-band {
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border-bottom: 2px solid var(--colmenia-gold);
}

.colmenia-band .inner,
.colmenia-foot .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0.9rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.colmenia-band img,
.colmenia-foot img {
  width: 3rem;
  height: 3rem;
  border-radius: 10px;
  flex: none;
}

.colmenia-band .wordmark {
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--colmenia-gold);
  font-size: 1rem;
  line-height: 1.2;
}

.colmenia-band .tagline {
  display: block;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  color: var(--colmenia-gold-soft);
  opacity: 0.75;
  font-weight: 500;
}

.colmenia-band .role {
  margin-left: auto;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--colmenia-on-dark);
  border: 1px solid var(--colmenia-gold);
  border-radius: 999px;
  padding: 0.25rem 0.85rem;
}

.colmenia-foot {
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border-top: 2px solid var(--colmenia-gold);
  margin-top: 3rem;
}

.colmenia-foot p {
  margin: 0;
  font-size: 0.85rem;
  max-width: 46ch;
  color: var(--colmenia-on-dark);
}

/* Se excluye el botón: si no, el color de enlace del pie gana por especificidad
   y el texto queda dorado sobre dorado. */
.colmenia-foot a:not(.telegram-link) {
  color: var(--colmenia-gold);
  font-weight: 600;
}

.telegram-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
  min-height: 2.9rem;
  padding: 0.55rem 1.3rem;
  border-radius: 999px;
  background: var(--colmenia-gold);
  color: var(--colmenia-ink);
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

.telegram-link:hover,
.telegram-link:focus-visible {
  background: var(--colmenia-gold-soft);
}

.colmenia-cta {
  display: flex;
  gap: 1.2rem;
  align-items: center;
  flex-wrap: wrap;
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border: 2px solid var(--colmenia-gold);
  border-radius: var(--radius);
  padding: 1.3rem 1.5rem;
  margin: 2rem 0;
}

.colmenia-cta h3 {
  margin: 0 0 0.2rem;
  color: var(--colmenia-gold);
}

.colmenia-cta p {
  margin: 0;
  color: var(--colmenia-on-dark);
  font-size: 0.92rem;
  max-width: 44ch;
}

@media print {
  .colmenia-band .role,
  .telegram-link,
  .colmenia-cta {
    display: none !important;
  }

  .colmenia-band,
  .colmenia-foot {
    background: #fff;
    color: #000;
    border-color: #999;
  }

  .colmenia-band .wordmark,
  .colmenia-foot a {
    color: #000;
  }
}

/* ---------- 13/11/2026 · captación de Colmenia School (mismo patrón que Suena igual) ---------- */
.lema { font-size: 1.2rem; margin: 0.2rem 0 1rem; }
.cta { display: block; position: relative; margin: 1.2rem 0; padding: 14px 14px 12px; border-radius: 20px; max-width: 480px; text-align: left; text-decoration: none; color: #10231a; background: #ffe9a8; border: 2px solid #10231a; box-shadow: 0 6px 0 #10231a; }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 #10231a; }
.cta-abeja { position: absolute; right: 10px; top: 6px; font-size: 44px; line-height: 1; animation: numeria-abeja 2.6s ease-in-out infinite; }
.cta-txt { display: block; padding-right: 54px; }
.cta-txt b { display: block; font-weight: 700; font-size: 1.25rem; line-height: 1.15; }
.cta-txt > span { display: block; font-size: 0.95rem; line-height: 1.35; margin-top: 4px; }
.cta-lista { display: flex !important; flex-wrap: wrap; margin: 8px -3px 0 !important; }
.cta-lista i { font-style: normal; font-weight: 700; font-size: 0.8rem; background: rgba(255, 255, 255, 0.75); border-radius: 99px; padding: 3px 9px; margin: 3px; }
.cta-skool { display: block; margin-top: 8px; font-size: 0.9rem; line-height: 1.35; font-weight: 700; background: rgba(255, 255, 255, 0.55); border-radius: 10px; padding: 6px 9px; }
.cta-ir { display: block; margin-top: 10px; padding: 11px 12px; border-radius: 14px; background: #10231a; color: #fff8e7; font-weight: 700; font-size: 1.1rem; text-align: center; }
.cta-vuelta { display: block; margin-top: 6px; font-size: 0.78rem; line-height: 1.3; text-align: center; opacity: 0.85; }
@keyframes numeria-abeja { 0%, 100% { transform: translate(0, 0) rotate(-6deg); } 50% { transform: translate(-4px, -5px) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .cta-abeja { animation: none; } }
.firma-bloque { margin: 1.6rem 0 0.4rem; text-align: center; }
.firma { font-weight: 700; margin: 0 0 0.3rem; }
.nota { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }
.despedida { position: fixed; inset: 0; background: rgba(16, 35, 26, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.despedida-caja { background: var(--surface); border-radius: 22px; padding: 18px; max-width: 520px; width: 100%; position: relative; }
.despedida-x { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 1.4rem; cursor: pointer; min-width: 44px; min-height: 44px; }
.despedida-t { font-weight: 700; font-size: 1.2rem; margin: 0 0 0.4rem; }
.label-like { display: block; font-weight: 600; margin-bottom: 0.35rem; }
.toques { display: flex; gap: 8px; flex-wrap: wrap; }
.toque { min-height: 44px; min-width: 72px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font: inherit; cursor: pointer; }
.toque.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.checks { border: 0; padding: 0; margin: 1rem 0 0.4rem; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.checks legend { font-weight: 600; margin-bottom: 0.35rem; }
.checks label, .permiso { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 400; }
.permiso { display: block; margin: 0.8rem 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-alt); }
.permiso.falta { outline: 3px solid #b42318; }
.error { color: #b42318; font-weight: 700; }

/* ---------- 13/11/2026 · informe con semáforo (criterio de Numeria, no baremo) ---------- */
.semaforo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.area { border-left: 8px solid var(--line); margin: 0; }
.area h3 { margin: 0.2rem 0 0.4rem; }
.area .luz { font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.area .bola { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #9aa5a0; }
.luz-verde { border-left-color: #2f8f5b; } .luz-verde .bola { background: #2f8f5b; }
.luz-ambar { border-left-color: #d08a13; } .luz-ambar .bola { background: #d08a13; }
.luz-rojo { border-left-color: #b42318; } .luz-rojo .bola { background: #b42318; }
.area .ref { margin-bottom: 0; }
.practicar li { margin-bottom: 0.4rem; }
@media print { .cta, .despedida { display: none !important; } }

/* ---------- 13/11/2026 · antesala al estilo de Snake de palabras ---------- */
main.con-antesala { padding-top: 1rem; }
.antesala { background: #fff8e7; border-radius: 28px; padding: 18px 18px 22px; box-shadow: 0 10px 30px rgba(16, 35, 26, 0.12); text-align: center; margin-bottom: 1.4rem; }
.antesala-logos { display: flex; justify-content: center; gap: 14px; align-items: center; margin-bottom: 12px; }
.antesala-logos img { height: 40px; width: auto; border-radius: 8px; background: #fff; }
.heroe-svg { display: block; width: 100%; height: auto; border-radius: 22px; }
.antesala h1 { font-size: clamp(2.4rem, 7vw, 3.6rem); letter-spacing: 0.04em; margin: 16px 0 4px; color: #1d2321; }
.antesala .lema { font-size: 1.15rem; max-width: 34rem; margin: 0 auto 14px; color: #2f4a40; }
.boton-grande { display: inline-block; min-width: 260px; padding: 18px 28px; border-radius: 999px; background: #f4b93a; color: #10231a; font-weight: 800; font-size: 1.5rem; text-decoration: none; box-shadow: 0 6px 0 #c98a0b; }
.boton-grande:active { transform: translateY(4px); box-shadow: 0 2px 0 #c98a0b; }
.boton-grande:focus-visible { outline: 4px solid #2f6d5b; outline-offset: 3px; }
.areas-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 20px 0 14px; }
.area-mini { background: #fff; border: 2px solid #d8ded8; border-radius: 18px; padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.area-mini svg { width: 80px; height: 48px; }
.area-mini b { font-size: 1rem; color: #1d2321; }
.area-mini span { font-size: 0.82rem; color: #4c5652; line-height: 1.25; }
.privacidad-pill { display: inline-block; background: #eef1ec; border-radius: 14px; padding: 8px 12px; font-size: 0.9rem; margin: 4px 0 6px; }
.mini-datos { font-size: 0.85rem; color: #4c5652; margin: 4px 0 0; }
.antesala .cta { margin: 16px auto 0; }

/* El prototipo se sirve como un único fichero: sin cabecera de sitio ni rutas. */
main { padding-top: 2.5rem; }
