<title>NUMERIA</title>
<meta name="description" content="Screening digital de competencia numérica. Orientativo, no diagnóstico." />
<style>
/*
 * NUMERIA — hoja de estilo base.
 *
 * Diseño tranquilo y de alto contraste, pensado primero para tablet: superficies
 * amplias, tipografía grande y ninguna estética médica ni de examen.
 */

:root {
  color-scheme: light;
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-alt: #eef1ec;
  --ink: #1d2321;
  --ink-soft: #4c5652;
  --line: #d8ded8;
  --accent: #2f6d5b;
  --accent-soft: #dceae4;
  --accent-ink: #ffffff;
  --warn: #8a5a12;
  --warn-soft: #fbf0dc;
  --alert: #8c3a2f;
  --alert-soft: #f8e3df;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 2px 10px rgba(29, 35, 33, 0.06);
  --max-width: 68rem;
}

/*
 * Tema oscuro. Se define en tres sitios porque el visor puede estar en tres
 * estados: sin marcar (solo cuenta la preferencia del sistema), marcado como
 * claro o marcado como oscuro. Solo se redefinen los tokens; ningún componente
 * declara color dentro de estos bloques.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --bg: #141917;
    --surface: #1c2320;
    --surface-alt: #232b28;
    --ink: #eef2ef;
    --ink-soft: #b3bdb8;
    --line: #333d39;
    --accent: #7fc0a8;
    --accent-soft: #24352e;
    --accent-ink: #10231c;
    --warn: #e0b877;
    --warn-soft: #34291a;
    --alert: #e8a496;
    --alert-soft: #351f1b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #141917;
    --surface: #1c2320;
    --surface-alt: #232b28;
    --ink: #eef2ef;
    --ink-soft: #b3bdb8;
    --line: #333d39;
    --accent: #7fc0a8;
    --accent-soft: #24352e;
    --accent-ink: #10231c;
    --warn: #e0b877;
    --warn-soft: #34291a;
    --alert: #e8a496;
    --alert-soft: #351f1b;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 18px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

main {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

h1 {
  font-size: clamp(1.9rem, 4vw, 2.7rem);
  line-height: 1.15;
  margin: 0 0 1rem;
  letter-spacing: -0.02em;
}

h2 {
  font-size: clamp(1.3rem, 2.4vw, 1.7rem);
  margin: 2.4rem 0 0.8rem;
  letter-spacing: -0.01em;
}

h3 {
  font-size: 1.15rem;
  margin: 1.6rem 0 0.5rem;
}

p {
  margin: 0 0 1rem;
  max-width: 62ch;
}

a {
  color: var(--accent);
}

.site-header {
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.site-header .inner,
.site-footer .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0.9rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
}

.brand {
  font-weight: 700;
  letter-spacing: 0.04em;
  text-decoration: none;
  color: var(--ink);
}

.brand span {
  display: block;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}

nav.main-nav {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
}

nav.main-nav a {
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 0.95rem;
}

nav.main-nav a:hover,
nav.main-nav a:focus-visible {
  color: var(--accent);
  text-decoration: underline;
}

.site-footer {
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.85rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
}

.card + .card {
  margin-top: 1rem;
}

.grid {
  display: grid;
  gap: 1rem;
}

@media (min-width: 48rem) {
  .grid.two {
    grid-template-columns: 1fr 1fr;
  }
  .grid.three {
    grid-template-columns: repeat(3, 1fr);
  }
}

.button,
button.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 3.2rem;
  padding: 0.7rem 1.6rem;
  border-radius: 999px;
  border: 2px solid transparent;
  background: var(--accent);
  color: var(--accent-ink);
  font: inherit;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

.button.secondary {
  background: transparent;
  color: var(--accent);
  border-color: var(--accent);
}

.button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

.notice {
  border-left: 5px solid var(--accent);
  background: var(--accent-soft);
  padding: 1rem 1.2rem;
  border-radius: var(--radius-sm);
  margin: 1.2rem 0;
}

.notice.warn {
  border-color: var(--warn);
  background: var(--warn-soft);
}

.notice.alert {
  border-color: var(--alert);
  background: var(--alert-soft);
}

.muted {
  color: var(--ink-soft);
}

.small {
  font-size: 0.88rem;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 0.35rem;
}

input[type='number'],
input[type='text'],
input[type='password'],
select {
  width: 100%;
  min-height: 3rem;
  padding: 0.6rem 0.8rem;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
}

fieldset {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 1rem;
  margin: 0 0 1.2rem;
}

legend {
  font-weight: 600;
  padding: 0 0.4rem;
}

.checkbox-row {
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  margin-bottom: 0.9rem;
}

.checkbox-row input {
  width: 1.4rem;
  height: 1.4rem;
  margin-top: 0.25rem;
  flex: none;
}

.checkbox-row label {
  font-weight: 400;
  margin: 0;
}

/* --- Perfil de dominios --------------------------------------------------- */

.profile-row {
  display: grid;
  grid-template-columns: minmax(9rem, 16rem) 1fr auto;
  gap: 0.8rem;
  align-items: center;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--line);
}

.profile-row:last-child {
  border-bottom: none;
}

.bar {
  background: var(--surface-alt);
  border-radius: 999px;
  height: 1.1rem;
  overflow: hidden;
}

.bar > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
}

.bar.vulnerable > span {
  background: var(--warn);
}

.bar.difficulty > span {
  background: var(--alert);
}

.score-value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  min-width: 3.2rem;
  text-align: right;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}

th,
td {
  text-align: left;
  padding: 0.45rem 0.6rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

th {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
}

.table-scroll {
  overflow-x: auto;
}

/* --- Ejecución de tareas -------------------------------------------------- */

.task-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.task-progress {
  height: 0.5rem;
  background: var(--surface-alt);
}

.task-progress > span {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.25s ease;
}

.task-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 1.5rem 1rem 3rem;
  text-align: center;
  width: min(56rem, 100%);
  margin: 0 auto;
}

.task-prompt {
  font-size: clamp(1.4rem, 3.5vw, 2.1rem);
  font-weight: 600;
  margin: 0;
}

.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(7rem, 11rem));
  gap: 1rem;
  justify-content: center;
}

@media (min-width: 40rem) {
  .choice-grid.four {
    grid-template-columns: repeat(4, minmax(6rem, 8rem));
  }
}

.choice-button {
  min-height: 5rem;
  font-size: 1.8rem;
  font-weight: 700;
  border-radius: var(--radius);
  border: 3px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-family: inherit;
}

.choice-button:hover {
  border-color: var(--accent);
}

.choice-button[aria-pressed='true'] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.side-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  width: 100%;
}

.side-button {
  border: 3px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0.6rem;
  cursor: pointer;
  aspect-ratio: 1 / 1;
  display: block;
  width: 100%;
}

.side-button:hover {
  border-color: var(--accent);
}

.number-pair {
  font-size: clamp(3rem, 12vw, 6rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: var(--ink);
}

.number-line {
  width: 100%;
  touch-action: manipulation;
  cursor: crosshair;
}

.timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--ink-soft);
}

.feedback {
  font-size: 1.1rem;
  min-height: 1.8rem;
  color: var(--ink-soft);
}

.instructions {
  text-align: left;
  max-width: 42rem;
}

.instructions li {
  margin-bottom: 0.6rem;
}

.badge {
  display: inline-block;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  background: var(--surface-alt);
  color: var(--ink-soft);
}

.badge.ok {
  background: var(--accent-soft);
  color: var(--accent);
}

.badge.warn {
  background: var(--warn-soft);
  color: var(--warn);
}

.badge.alert {
  background: var(--alert-soft);
  color: var(--alert);
}

.demo-banner {
  background: var(--warn-soft);
  color: var(--warn);
  border-bottom: 1px solid var(--warn);
  text-align: center;
  padding: 0.5rem 1rem;
  font-weight: 600;
  font-size: 0.9rem;
}

@media print {
  .site-header,
  .site-footer,
  .no-print {
    display: none !important;
  }

  body {
    background: #fff;
    color: #000;
    font-size: 11.5pt;
  }

  main {
    max-width: none;
    padding: 0;
  }

  .card {
    border: 1px solid #999;
    box-shadow: none;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  h2 {
    break-after: avoid;
  }
}

/*
 * Identidad de Colmenia para el prototipo.
 *
 * Vive fuera del sistema de estilos de NUMERIA a propósito: el dorado sobre
 * fondo oscuro identifica a Colmenia en la cabecera y el pie, y no entra en las
 * pantallas de tarea, que deben seguir siendo tranquilas y sin estímulos que
 * compitan con el ejercicio.
 */

:root {
  --colmenia-ink: #15130f;
  --colmenia-gold: #d4af52;
  --colmenia-gold-soft: #f0dca4;
  --colmenia-on-dark: #efe9dc;
}

.colmenia-band {
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border-bottom: 2px solid var(--colmenia-gold);
}

.colmenia-band .inner,
.colmenia-foot .inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0.9rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.colmenia-band img,
.colmenia-foot img {
  width: 3rem;
  height: 3rem;
  border-radius: 10px;
  flex: none;
}

.colmenia-band .wordmark {
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--colmenia-gold);
  font-size: 1rem;
  line-height: 1.2;
}

.colmenia-band .tagline {
  display: block;
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  color: var(--colmenia-gold-soft);
  opacity: 0.75;
  font-weight: 500;
}

.colmenia-band .role {
  margin-left: auto;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--colmenia-on-dark);
  border: 1px solid var(--colmenia-gold);
  border-radius: 999px;
  padding: 0.25rem 0.85rem;
}

.colmenia-foot {
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border-top: 2px solid var(--colmenia-gold);
  margin-top: 3rem;
}

.colmenia-foot p {
  margin: 0;
  font-size: 0.85rem;
  max-width: 46ch;
  color: var(--colmenia-on-dark);
}

/* Se excluye el botón: si no, el color de enlace del pie gana por especificidad
   y el texto queda dorado sobre dorado. */
.colmenia-foot a:not(.telegram-link) {
  color: var(--colmenia-gold);
  font-weight: 600;
}

.telegram-link {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
  min-height: 2.9rem;
  padding: 0.55rem 1.3rem;
  border-radius: 999px;
  background: var(--colmenia-gold);
  color: var(--colmenia-ink);
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}

.telegram-link:hover,
.telegram-link:focus-visible {
  background: var(--colmenia-gold-soft);
}

.colmenia-cta {
  display: flex;
  gap: 1.2rem;
  align-items: center;
  flex-wrap: wrap;
  background: var(--colmenia-ink);
  color: var(--colmenia-on-dark);
  border: 2px solid var(--colmenia-gold);
  border-radius: var(--radius);
  padding: 1.3rem 1.5rem;
  margin: 2rem 0;
}

.colmenia-cta h3 {
  margin: 0 0 0.2rem;
  color: var(--colmenia-gold);
}

.colmenia-cta p {
  margin: 0;
  color: var(--colmenia-on-dark);
  font-size: 0.92rem;
  max-width: 44ch;
}

@media print {
  .colmenia-band .role,
  .telegram-link,
  .colmenia-cta {
    display: none !important;
  }

  .colmenia-band,
  .colmenia-foot {
    background: #fff;
    color: #000;
    border-color: #999;
  }

  .colmenia-band .wordmark,
  .colmenia-foot a {
    color: #000;
  }
}

/* El prototipo se sirve como un único fichero: sin cabecera de sitio ni rutas. */
main { padding-top: 2.5rem; }
</style>
<div id="root"></div>
